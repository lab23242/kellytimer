<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shanshui</title>
  </head>
  <body>
    <main id="frame" class="frame" data-phase="focus" data-status="idle">
      <div id="landscape" class="landscape" aria-hidden="true"></div>
      <div class="mist" aria-hidden="true"></div>

      <div class="inscription">
        <div class="time-row">
          <span id="time" class="time" role="button" tabindex="0" title="Click to start or pause. Double-click for a smaller view." aria-live="off">25:00</span>
          <span id="seals" class="seals" role="img" aria-label="0 focus sessions today"></span>
        </div>
        <p id="phase" class="phase" aria-live="polite">Focus</p>
      </div>

      <nav class="controls" aria-label="Timer controls">
        <button id="btn-play" type="button" aria-label="Start" title="Start"></button>
        <button id="btn-skip" type="button" aria-label="Skip to next" title="Skip to next"></button>
        <button id="btn-reset" type="button" aria-label="Start this part again" title="Start this part again"></button>
        <button id="btn-settings" type="button" aria-label="Settings" title="Settings"></button>
        <button id="btn-hide" type="button" aria-label="Tuck away in the tray" title="Tuck away in the tray"></button>
        <button id="btn-close" type="button" aria-label="Close to the tray" title="Close (keeps running in the tray)"></button>
      </nav>

      <div class="progress" aria-hidden="true"><div id="progress-bar" class="progress-bar"></div></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
